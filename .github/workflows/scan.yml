# The scanner's real home.
#
# Why here and not in the Claude cloud routine: a routine run completed phase 1
# cleanly (5,965 queries, blocked=0, 10 minutes) and was then killed mid-phase-2
# by a CONTAINER RESTART. The scan was healthy; the environment simply is not
# built to babysit a 40-minute background process. GitHub runners are: a 6-hour
# job limit, no restarts, unrestricted egress, no TLS-inspecting proxy, free.
#
# So this workflow scans and commits the data. The Claude routine then reads
# that committed data, researches baggage policy, re-ranks and explains --
# minutes of work, and the part that has never failed.
#
# Required repo secret: DISCORD_WEBHOOK
#   Settings -> Secrets and variables -> Actions -> New repository secret

name: flight scan

on:
  workflow_dispatch:
    inputs:
      tier:
        description: "Airport tier (1=30 airports ~12min, 2=90 ~40min, 3=160 ~75min)"
        required: false
        default: "1"
        type: choice
        options: ["1", "2", "3"]
  schedule:
    # 16:20 UTC daily, ~70 minutes ahead of the 17:30 UTC routine, so the
    # routine always finds fresh data waiting for it.
    - cron: "20 16 * * *"

permissions:
  contents: write

concurrency:
  # Never let two scans race to commit the same data/ directory.
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # Deliberately far above the scanner's own 90-minute SCAN_DEADLINE_MIN.
    # The internal deadline stops gracefully and still writes results; a job
    # timeout is a SIGTERM that loses everything not yet checkpointed. The
    # internal one must always win the race.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Tier 1 by default, and the reasoning matters. Three separate runs were
      # killed mid-scan by things outside our control -- a container restart,
      # a SIGTERM -- and every one of them was healthy at the moment it died.
      # The common factor is duration, not correctness. Tier 1 with both modes
      # is ~6,400 queries and finishes in ~12 minutes instead of ~40, which is
      # a far smaller target.
      #
      # What this actually costs: 30 airports instead of 90. Those 30 are the
      # gateways with real Guatemala service plus the budget hubs -- including
      # DEN, so the Denver preference is untouched. Most of the other 60 return
      # nothing at all. Run tier 2 or 3 by hand from the Actions tab whenever
      # you want the wider sweep.
      - name: Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
        run: python main.py --tier ${{ inputs.tier || '1' }} --mode both

      - name: Commit results
        run: |
          git config user.name  "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "scan $(date -u +%F)"
          # Another run may have pushed while we scanned; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push

      - name: Report failure to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          curl -sS -H 'Content-Type: application/json' -X POST "$DISCORD_WEBHOOK" \
            -d '{"username":"flightwatch","content":"**Scan failed in GitHub Actions.** No fresh data today; the routine will report yesterday'"'"'s numbers as stale. See the Actions tab for the log."}'
