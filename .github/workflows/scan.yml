# The scanner's real home.
#
# Why here and not in the Claude cloud routine: a routine run completed phase 1
# cleanly (5,965 queries, blocked=0, 10 minutes) and was then killed mid-phase-2
# by a CONTAINER RESTART. The scan was healthy; the environment simply is not
# built to babysit a 40-minute background process. GitHub runners are: a 6-hour
# job limit, no restarts, unrestricted egress, no TLS-inspecting proxy, free.
#
# So this workflow scans and commits the data. The Claude routine then reads
# that committed data, researches baggage policy, re-ranks and explains --
# minutes of work, and the part that has never failed.
#
# Required repo secret: DISCORD_WEBHOOK
#   Settings -> Secrets and variables -> Actions -> New repository secret

name: flight scan

on:
  workflow_dispatch:
  schedule:
    # 16:20 UTC daily, ~70 minutes ahead of the 17:30 UTC routine, so the
    # routine always finds fresh data waiting for it.
    - cron: "20 16 * * *"

permissions:
  contents: write

concurrency:
  # Never let two scans race to commit the same data/ directory.
  group: flight-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Scan
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          DISCORD_MENTION_USER_ID: ${{ secrets.DISCORD_MENTION_USER_ID }}
        run: python main.py --tier 2 --mode both

      - name: Commit results
        run: |
          git config user.name  "flightwatch-bot"
          git config user.email "flightwatch-bot@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "scan $(date -u +%F)"
          # Another run may have pushed while we scanned; rebase rather than fail.
          git pull --rebase --autostash origin main
          git push

      - name: Report failure to Discord
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$DISCORD_WEBHOOK" ] && exit 0
          curl -sS -H 'Content-Type: application/json' -X POST "$DISCORD_WEBHOOK" \
            -d '{"username":"flightwatch","content":"**Scan failed in GitHub Actions.** No fresh data today; the routine will report yesterday'"'"'s numbers as stale. See the Actions tab for the log."}'
